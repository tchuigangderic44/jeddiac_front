# ==============================================================================
# NGINX CONFIGURATION FOR JEDDIAC.ORG & API.JEDDIAC.ORG
# ==============================================================================

# 1. FRONTEND: jeddiac.org & www.jeddiac.org (HTTPS)
server {
    listen 80;
    listen [::]:80;
    server_name jeddiac.org www.jeddiac.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name jeddiac.org www.jeddiac.org;

    # SSL Certificates (managed e.g. via certbot --nginx)
    # ssl_certificate /etc/letsencrypt/live/jeddiac.org/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/jeddiac.org/privkey.pem;

    root /var/www/jeddiac_front/dist;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 256;

    # Static assets cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # SPA Fallback router
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# 2. BACKEND API: api.jeddiac.org (HTTPS Reverse Proxy)
server {
    listen 80;
    listen [::]:80;
    server_name api.jeddiac.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.jeddiac.org;

    # SSL Certificates
    # ssl_certificate /etc/letsencrypt/live/api.jeddiac.org/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.jeddiac.org/privkey.pem;

    client_max_body_size 50M;

    # Proxy to Node.js backend running on 127.0.0.1:3000
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
